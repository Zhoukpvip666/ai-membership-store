# Only used by scripts/test-database.ts with a unique project and temporary env.
services:
  mysql:
    image: mysql:8.4
    command: ['--default-time-zone=+00:00']
    environment:
      MYSQL_DATABASE: foundation_test
      MYSQL_USER: foundation_test
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Test runner must provide a password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Test runner must provide a password}
    ports:
      - '127.0.0.1::3306'
    volumes:
      - test-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -N -e "SELECT 1"'
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 30s
volumes:
  test-data:
