# Supply a NEW project named membership-restore-<12 lowercase hex digits>.
services:
  mysql:
    image: docker.io/library/mysql:8.4.13@sha256:72c368d898861f3b3a07af0e6d690400f44f048799ed46822783d9224cc2c86d
    platform: linux/amd64
    labels:
      ai-membership-store.isolated-restore: 'true'
    environment:
      TZ: UTC
      MYSQL_DATABASE: membership_production
      MYSQL_ROOT_HOST: localhost
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/restore-root
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    secrets:
      - restore-root
      - restore-client
    volumes:
      - restore-data:/var/lib/mysql
    networks: [restore]
    stop_grace_period: 90s

networks:
  restore:
    internal: true
volumes:
  restore-data:
secrets:
  restore-root:
    file: ${RESTORE_ROOT_FILE:?Set a private synthetic root password file}
  restore-client:
    file: ${RESTORE_CLIENT_FILE:?Set a private MySQL socket client option file}
