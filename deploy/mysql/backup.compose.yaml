# Use with compose.yaml when the dedicated production database is provisioned.
services:
  mysql:
    networks: [default, backup]

  backup-client:
    image: docker.io/library/mysql:8.4.13@sha256:72c368d898861f3b3a07af0e6d690400f44f048799ed46822783d9224cc2c86d
    platform: linux/amd64
    profiles: [backup]
    entrypoint: []
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backup]
    volumes:
      - type: bind
        source: /etc/ai-membership-store/backup.mysql.cnf
        target: /run/secrets/backup.mysql.cnf
        read_only: true
        bind:
          create_host_path: false

networks:
  backup:
    internal: true
